controller:
  serviceType: ClusterIP
  adminUser: admin
  adminPassword: admin
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  javaOpts: >-
    -Xms512m
    -Xmx1g
    -XX:+UnlockExperimentalVMOptions
    -XX:+UseCGroupMemoryLimitForHeap
    -XX:MaxRAMFraction=2
    -Dsun.security.ssl.allowUnsafeRenegotiation=true
  installPlugins:
    - kubernetes:1.31.3
    - workflow-aggregator:2.6
    - git:4.11.0
    - configuration-as-code:1.55
    - blueocean:1.25.3
    - docker-workflow:1.28
    - pipeline-stage-view:2.19
    - credentials-binding:1.27
    - aws-credentials:1.0.15
    - ecr:1.6
    - helm:1.2
    - kubernetes-cli:1.10.6
    - git-parameter:0.9.18
    - parameterized-trigger:2.45
    - rebuild:1.34
    - timestamper:1.23
    - ws-cleanup:0.45
    - workflow-multibranch:2.26
    - branch-api:2.8.0
    - structs:1.23
    - scm-api:2.6.4
    - script-security:1.80
    - matrix-project:1.20
    - junit:1.57
    - credentials:2.6.2
    - plain-credentials:1.8
    - ssh-credentials:1.20
    - aws-java-sdk:1.12.261-357.v7b_1b_8b_8b_8b
