    - ecr:1.6
    - kubernetes:1.31.3
    - kubernetes-cli:1.10.6
    - helm:1.2
    - git-parameter:0.9.18
    - parameterized-trigger:2.45
    - rebuild:1.34
    - timestamper:1.23
    - ws-cleanup:0.45
    - workflow-multibranch:2.26
    - branch-api:2.8.0
    - structs:1.23
    - scm-api:2.6.4
    - script-security:1.80
    - matrix-project:1.20
    - junit:1.57
