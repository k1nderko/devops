    - apache-httpcomponents-client-4-api:4.5.14-208.v4e7d9a_7b_a_e1
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/jenkins-role
  ingress:
    enabled: false
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  agent:
    enabled: true
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/jenkins-agent-role
    containers:
      - name: docker
        image: docker:20.10.24
        command:
          - cat
        tty: true
        volumeMounts:
          - name: docker-sock
            mountPath: /var/run/docker.sock
        securityContext:
          privileged: true
      - name: kubectl
        image: bitnami/kubectl:1.28.0
        command:
          - cat
        tty: true
        volumeMounts:
          - name: kubectl-config
            mountPath: /home/jenkins/.kube
    volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
      - name: kubectl-config
        hostPath:
          path: /home/jenkins/.kube 