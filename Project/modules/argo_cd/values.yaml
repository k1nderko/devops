server:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  extraArgs:
    - --insecure
    - --rootpath
    - /
    - --rootpath
    - /argocd

repoServer:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

applicationSet:
  enabled: true
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

redis:
  enabled: true
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "100m"

configs:
  secret:
    argocdServerAdminPassword: admin

rbac:
  create: true
  pspEnabled: false

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/argocd-role

persistence:
  enabled: true
  size: 8Gi
  storageClass: "" 