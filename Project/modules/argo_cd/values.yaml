# Argo CD Server configuration
server:
  service:
    type: LoadBalancer
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  extraArgs:
    - --insecure

# Repository Server configuration
repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Application Controller configuration
applicationSet:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Redis configuration
redis:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# HAProxy configuration
haproxy:
  enabled: false

# Grafana configuration
grafana:
  enabled: false

# Prometheus configuration
prometheus:
  enabled: false

# Dex configuration (for SSO)
dex:
  enabled: false

# RBAC configuration
rbac:
  create: true
  pspEnabled: false

# Service Account configuration
serviceAccount:
  create: true
  name: "argocd-application-controller"

# Security configuration
configs:
  secret:
    argocdServerAdminPassword: "admin"
    argocdServerAdminPasswordMtime: "2023-01-01T00:00:00Z"

# High Availability configuration
controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Notifications configuration
notifications:
  enabled: false

# Backup configuration
backup:
  enabled: false 